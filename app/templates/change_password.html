{% extends 'layout.html' %}
{% block heading %}Change Password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1><p>Choose a new password for your account.</p></div></div>
<div class="card" style="max-width:460px">
  <form method="post" class="form-grid" style="grid-template-columns:1fr" autocomplete="off">
    <label>New password<input type="password" name="new_password" minlength="6" required autocomplete="new-password"></label>
    <label>Confirm new password<input type="password" name="confirm_password" minlength="6" required autocomplete="new-password"></label>
    <div><button class="btn primary" type="submit">Update password</button></div>
  </form>
</div>
{% endblock %}
