<p class="muted">Choose up to three children below. All child selections are optional. Each option shows the student code and admission number. You can link more children later; existing links are kept.</p>
{% for number in range(1, 4) %}
<label style="margin-top:10px">Child {{ number }} (optional)
<select name="child_ids"><option value="">Select a child</option>
{% for child in student_options %}<option value="{{ child.studentId }}">{{ child.student_name }} · Code: {{ child.student_code or '—' }} · Adm. no: {{ child.ADMNO or '—' }} · {{ child.class_name or '' }} {{ child.section_name or '' }}</option>{% endfor %}
</select></label>
{% endfor %}
